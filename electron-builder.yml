appId: com.nexfetch.desktop
productName: NexFetch
copyright: Copyright © 2026 Shubhabrata Ghosh
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  - from: resources/assets
    to: assets
    filter:
      - nexfetch_icon.png
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
linux:
  icon: build/icons
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
